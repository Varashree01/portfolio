<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Varashree H A — AI Engineer, Research Enthusiast and Full Stack Developer." />
  <title>Varashree H A — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="window">
    <header class="topbar">
      <div class="traffic">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
      </div>
      <div class="menu">
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Run</span>
        <span>Terminal</span>
      </div>
      <button class="search" id="searchBtn" aria-label="Open command palette">
        <span>varashree-ha / portfolio</span>
        <kbd>Ctrl K</kbd>
      </button>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="side-title">Explorer</div>
        <ul id="tree"></ul>
      </aside>

      <main class="main">
        <div class="tabs" id="tabs"></div>
        <div class="crumbs" id="crumbs"></div>
        <article id="editor" class="editor"></article>
      </main>
    </div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <button class="panel-tab active" data-panel="terminal">Terminal</button>
        <button class="panel-tab" data-panel="output">Output</button>
        <button class="panel-action" data-panel-action="minimize" aria-label="Minimize terminal">—</button>
        <button class="panel-action" data-panel-action="compact" aria-label="Shrink terminal">▢</button>
        <button class="panel-action" data-panel-action="expand" aria-label="Expand terminal">⤢</button>
        <button class="panel-close" id="closePanel" aria-label="Close terminal">×</button>
      </div>
      <div class="terminal" id="terminal"></div>
      <div class="terminal-input-wrap">
        <span class="prompt">varashree@portfolio:~$</span>
        <input id="terminalInput" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal command input" />
      </div>
    </div>

    <footer class="statusbar">
      <div class="status-left">
        <span>main</span>
        <span id="statusFile">home.tsx</span>
      </div>
      <div class="status-right">
        <span id="statusLang">TypeScript React</span>
        <span id="statusClock">--:--</span>
      </div>
    </footer>
  </div>

  <div class="palette hidden" id="palette">
    <div class="palette-panel">
      <div class="palette-search">
        <span>⌕</span>
        <input id="paletteInput" type="text" placeholder="Search files or commands" autocomplete="off" spellcheck="false" />
      </div>
      <div id="paletteList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
